<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Booking System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        navy: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 300:'#93c5fd', 400:'#60a5fa', 500:'#3b82f6', 600:'#1e40af', 700:'#1e3a8a', 800:'#1e3a5f', 900:'#0f172a' },
        gold: { 50:'#fefce8', 100:'#fef9c3', 200:'#fef08a', 300:'#fde047', 400:'#facc15', 500:'#eab308', 600:'#ca8a04', 700:'#a16207' },
      },
      fontFamily: {
        display: ['Playfair Display', 'serif'],
        body: ['Karla', 'sans-serif'],
      }
    }
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Karla', sans-serif; }
  .font-display { font-family: 'Playfair Display', serif; }
  .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards; }
  @keyframes slideIn { from { transform: translateX(100%); opacity:0; } to { transform: translateX(0); opacity:1; } }
  @keyframes fadeOut { to { opacity:0; transform: translateY(-10px); } }
  .tab-active { border-bottom: 2px solid #ca8a04; color: #1e3a8a; font-weight: 600; }
  input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(202,138,4,0.4); }
  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

<!-- Toast container -->
<div id="toasts" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

<!-- Navbar -->
<nav class="bg-navy-700 text-white sticky top-0 z-40 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-gold-500 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-navy-900" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M3 7v14m6-14v14m6-14v14m6-14v14M6 7h12l3-4H3l3 4z"/></svg>
      </div>
      <span class="font-display text-xl font-semibold tracking-wide">Grandstay</span>
    </div>
    <div class="hidden md:flex items-center gap-1 text-sm" id="navLinks"></div>
    <div class="flex items-center gap-3">
      <div id="authStatus" class="text-xs text-navy-200"></div>
      <button onclick="showSection('auth')" class="bg-gold-500 hover:bg-gold-600 text-navy-900 font-semibold px-4 py-1.5 rounded-lg text-sm transition cursor-pointer" id="authBtn">Sign In</button>
    </div>
  </div>
</nav>

<!-- Hero (shown when not logged in) -->
<section id="hero" class="bg-gradient-to-br from-navy-700 via-navy-800 to-navy-900 text-white py-20 px-4">
  <div class="max-w-4xl mx-auto text-center">
    <h1 class="font-display text-4xl md:text-5xl font-bold mb-4">Hotel Booking System</h1>
    <p class="text-navy-200 text-lg mb-8 max-w-2xl mx-auto">Full-featured hotel reservation platform with dynamic pricing, role-based access, and real-time availability search.</p>
    <div class="flex flex-wrap justify-center gap-4">
      <button onclick="showSection('auth')" class="bg-gold-500 hover:bg-gold-600 text-navy-900 font-semibold px-6 py-3 rounded-lg transition cursor-pointer">Get Started</button>
      <button onclick="checkHealth()" class="border border-navy-400 hover:border-white text-white px-6 py-3 rounded-lg transition cursor-pointer">Check API Health</button>
    </div>
    <div id="heroHealth" class="mt-6"></div>
  </div>
</section>

<!-- Main content -->
<main class="max-w-7xl mx-auto px-4 py-8">
  <div id="content" class="hidden"></div>
</main>

<!-- Footer -->
<footer class="bg-navy-900 text-navy-300 text-center py-6 text-sm mt-12">
  Hotel Booking System &mdash; CIA 3 Project &mdash; Node.js + Express + MongoDB
</footer>

<script>
const API = 'http://localhost:5000';
let state = { token: null, user: null, section: null };

// ── Utilities ──
function toast(msg, type='info') {
  const el = document.createElement('div');
  const colors = { success:'bg-green-600', error:'bg-red-600', info:'bg-navy-700', warning:'bg-gold-600' };
  el.className = `toast ${colors[type]||colors.info} text-white px-4 py-2.5 rounded-lg shadow-lg text-sm`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const json = await res.json();
  if (!json.success) throw { status: res.status, ...json };
  return json;
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : '-'; }
function formatCurrency(n) { return '₹' + Number(n||0).toLocaleString('en-IN', {minimumFractionDigits:2}); }

function statusBadge(s) {
  const c = { RESERVED:'bg-blue-100 text-blue-700', CONFIRMED:'bg-green-100 text-green-700', CHECKED_IN:'bg-purple-100 text-purple-700', CHECKED_OUT:'bg-gray-200 text-gray-600', CANCELLED:'bg-red-100 text-red-600' };
  return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold ${c[s]||'bg-gray-100'}">${s}</span>`;
}

function hkBadge(s) {
  const c = { CLEAN:'bg-green-100 text-green-700', DIRTY:'bg-amber-100 text-amber-700', MAINTENANCE:'bg-red-100 text-red-600' };
  return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold ${c[s]||''}">${s}</span>`;
}

function stars(n) {
  let h = '';
  for (let i=1;i<=5;i++) h += i<=n ? '<svg class="w-4 h-4 text-gold-500 inline" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>' : '<svg class="w-4 h-4 text-gray-300 inline" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
  return h;
}

// ── Auth ──
function saveSession(token, user) {
  state.token = token;
  state.user = user;
  localStorage.setItem('token', token);
  localStorage.setItem('user', JSON.stringify(user));
  updateNav();
}

function loadSession() {
  const t = localStorage.getItem('token');
  const u = localStorage.getItem('user');
  if (t && u) { state.token = t; state.user = JSON.parse(u); updateNav(); }
}

function logout() {
  state.token = null; state.user = null;
  localStorage.removeItem('token'); localStorage.removeItem('user');
  updateNav(); showSection('hero'); toast('Signed out', 'info');
}

// ── Navigation ──
function navItems() {
  if (!state.user) return [];
  const r = state.user.role;
  const items = [{id:'search', label:'Search', icon:'M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z'}];
  items.push({id:'bookings', label:'Bookings', icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2'});
  if (r === 'guest') items.push({id:'mybookings', label:'My Bookings', icon:'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z'});
  if (r === 'admin' || r === 'staff') {
    items.push({id:'hotels', label:'Hotels', icon:'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4'});
    items.push({id:'rooms', label:'Rooms', icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4'});
  }
  if (r === 'admin') {
    items.push({id:'pricing', label:'Pricing', icon:'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z'});
    items.push({id:'reports', label:'Reports', icon:'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z'});
  }
  return items;
}

function updateNav() {
  const items = navItems();
  const nav = document.getElementById('navLinks');
  nav.innerHTML = items.map(i => `<button onclick="showSection('${i.id}')" class="nav-link px-3 py-1.5 rounded hover:bg-navy-600 transition cursor-pointer" data-section="${i.id}">${i.label}</button>`).join('');
  const authBtn = document.getElementById('authBtn');
  const authStatus = document.getElementById('authStatus');
  if (state.user) {
    authBtn.textContent = 'Sign Out';
    authBtn.onclick = logout;
    authStatus.innerHTML = `<span class="text-gold-400 font-semibold">${esc(state.user.name)}</span> <span class="text-navy-300">(${state.user.role})</span>`;
    document.getElementById('hero').classList.add('hidden');
  } else {
    authBtn.textContent = 'Sign In';
    authBtn.onclick = () => showSection('auth');
    authStatus.innerHTML = '';
    document.getElementById('hero').classList.remove('hidden');
  }
}

function highlightNav(id) {
  document.querySelectorAll('.nav-link').forEach(el => {
    el.classList.toggle('tab-active', el.dataset.section === id);
  });
}

// ── Sections ──
function showSection(id) {
  if (id === 'hero') { document.getElementById('content').classList.add('hidden'); document.getElementById('hero').classList.remove('hidden'); return; }
  document.getElementById('hero').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');
  state.section = id;
  highlightNav(id);
  const c = document.getElementById('content');
  c.className = 'fade-in';
  switch(id) {
    case 'auth': renderAuth(c); break;
    case 'search': renderSearch(c); break;
    case 'bookings': renderBookings(c); break;
    case 'mybookings': renderMyBookings(c); break;
    case 'hotels': renderHotels(c); break;
    case 'rooms': renderRooms(c); break;
    case 'pricing': renderPricing(c); break;
    case 'reports': renderReports(c); break;
    default: c.innerHTML = '<p class="text-gray-500">Section not found.</p>';
  }
}

// ── Auth Section ──
function renderAuth(c) {
  if (state.user) { showSection('search'); return; }
  c.innerHTML = `
  <div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="flex border-b">
        <button onclick="authTab('login')" id="loginTab" class="flex-1 py-3 text-sm font-semibold tab-active cursor-pointer">Sign In</button>
        <button onclick="authTab('register')" id="registerTab" class="flex-1 py-3 text-sm font-semibold text-gray-400 cursor-pointer">Register</button>
      </div>
      <div class="p-6">
        <div id="loginForm">
          <div class="space-y-4">
            <div><label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
              <input id="loginEmail" type="email" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm" placeholder="you@example.com"></div>
            <div><label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
              <input id="loginPass" type="password" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm" placeholder="Enter password"></div>
            <button onclick="doLogin()" class="w-full bg-navy-700 hover:bg-navy-800 text-white font-semibold py-2.5 rounded-lg transition cursor-pointer" id="loginBtn">Sign In</button>
          </div>
        </div>
        <div id="registerForm" class="hidden">
          <div class="space-y-4">
            <div><label class="block text-sm font-medium text-gray-600 mb-1">Full Name</label>
              <input id="regName" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm" placeholder="John Doe"></div>
            <div><label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
              <input id="regEmail" type="email" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm" placeholder="you@example.com"></div>
            <div><label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
              <input id="regPass" type="password" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm" placeholder="Min 6 characters"></div>
            <div><label class="block text-sm font-medium text-gray-600 mb-1">Role</label>
              <select id="regRole" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white">
                <option value="guest">Guest</option><option value="staff">Staff</option><option value="admin">Admin</option>
              </select></div>
            <button onclick="doRegister()" class="w-full bg-gold-500 hover:bg-gold-600 text-navy-900 font-semibold py-2.5 rounded-lg transition cursor-pointer" id="regBtn">Create Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function authTab(tab) {
  document.getElementById('loginForm').classList.toggle('hidden', tab!=='login');
  document.getElementById('registerForm').classList.toggle('hidden', tab!=='register');
  document.getElementById('loginTab').className = tab==='login' ? 'flex-1 py-3 text-sm font-semibold tab-active cursor-pointer' : 'flex-1 py-3 text-sm font-semibold text-gray-400 cursor-pointer';
  document.getElementById('registerTab').className = tab==='register' ? 'flex-1 py-3 text-sm font-semibold tab-active cursor-pointer' : 'flex-1 py-3 text-sm font-semibold text-gray-400 cursor-pointer';
}

async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!email || !password) return toast('Fill in all fields', 'error');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const r = await api('POST', '/api/auth/login', { email, password });
    saveSession(r.data.token, r.data.user);
    toast('Welcome back, ' + r.data.user.name, 'success');
    showSection('search');
  } catch(e) { toast(e.message || 'Login failed', 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}

async function doRegister() {
  const btn = document.getElementById('regBtn');
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPass').value;
  const role = document.getElementById('regRole').value;
  if (!name || !email || !password) return toast('Fill in all fields', 'error');
  if (password.length < 6) return toast('Password must be at least 6 characters', 'error');
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const r = await api('POST', '/api/auth/register', { name, email, password, role });
    saveSession(r.data.token, r.data.user);
    toast('Account created. Welcome, ' + r.data.user.name, 'success');
    showSection('search');
  } catch(e) { toast(e.message || 'Registration failed', 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Create Account'; }
}

// ── Search Section ──
async function renderSearch(c) {
  let hotelsHtml = '';
  try {
    const r = await api('GET', '/api/hotels');
    hotelsHtml = r.data.map(h => `<option value="${h._id}">${esc(h.name)} (${esc(h.city)})</option>`).join('');
  } catch(e) {}

  c.innerHTML = `
  <div class="mb-8">
    <h2 class="font-display text-2xl font-bold text-navy-700 mb-1">Search Availability</h2>
    <p class="text-gray-500 text-sm">Find available rooms across all properties</p>
  </div>
  <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div><label class="block text-sm font-medium text-gray-600 mb-1">Hotel</label>
        <select id="sHotel" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white"><option value="">All Hotels</option>${hotelsHtml}</select></div>
      <div><label class="block text-sm font-medium text-gray-600 mb-1">Check-in</label>
        <input id="sCheckIn" type="date" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-medium text-gray-600 mb-1">Check-out</label>
        <input id="sCheckOut" type="date" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm"></div>
      <div><label class="block text-sm font-medium text-gray-600 mb-1">Guests</label>
        <input id="sGuests" type="number" min="1" value="2" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm"></div>
    </div>
    <button onclick="doSearch()" class="mt-4 bg-navy-700 hover:bg-navy-800 text-white font-semibold px-6 py-2.5 rounded-lg transition cursor-pointer" id="searchBtn">
      <span class="flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Search
      </span>
    </button>
  </div>
  <div id="searchResults"></div>`;
}

async function doSearch() {
  const hotelId = document.getElementById('sHotel').value;
  const checkIn = document.getElementById('sCheckIn').value;
  const checkOut = document.getElementById('sCheckOut').value;
  const guests = document.getElementById('sGuests').value;
  if (!checkIn || !checkOut) return toast('Select check-in and check-out dates', 'error');
  if (new Date(checkIn) >= new Date(checkOut)) return toast('Check-out must be after check-in', 'error');

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  const out = document.getElementById('searchResults');
  out.innerHTML = '<div class="text-center py-8 text-gray-400">Searching...</div>';

  try {
    let url = `/api/hotels/search?checkIn=${checkIn}&checkOut=${checkOut}&guests=${guests}`;
    if (hotelId) url += `&hotelId=${hotelId}`;
    const r = await api('GET', url);
    if (r.data.length === 0) {
      out.innerHTML = '<div class="bg-white rounded-2xl shadow p-8 text-center text-gray-500">No rooms found for these dates. Try different dates or fewer guests.</div>';
      return;
    }
    out.innerHTML = r.data.map(h => `
      <div class="bg-white rounded-2xl shadow-lg p-6 mb-4">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h3 class="font-display text-xl font-bold text-navy-700">${esc(h.name)}</h3>
            <p class="text-gray-500 text-sm">${esc(h.city)} &middot; ${stars(h.rating)}</p>
            <div class="flex flex-wrap gap-1.5 mt-2">${(h.amenities||[]).map(a => `<span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-xs">${esc(a)}</span>`).join('')}</div>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          ${h.availableRoomTypes.map(rt => `
            <div class="border border-gray-200 rounded-xl p-4 hover:border-gold-400 transition">
              <div class="flex justify-between items-start mb-2">
                <span class="font-semibold text-navy-700">${esc(rt.name)}</span>
                <span class="text-gold-600 font-bold text-sm">${formatCurrency(rt.basePrice)}/night</span>
              </div>
              <div class="text-xs text-gray-500 space-y-1 mb-3">
                <div>Capacity: ${rt.capacity} guests</div>
                <div>${rt.availableRooms} of ${rt.totalRooms} rooms available</div>
              </div>
              <button onclick='openBookingModal(${JSON.stringify({hotelId:h.hotelId,hotelName:h.name,roomTypeId:rt.roomTypeId,roomTypeName:rt.name,basePrice:rt.basePrice,capacity:rt.capacity,available:rt.availableRooms,checkIn:document.getElementById("sCheckIn").value,checkOut:document.getElementById("sCheckOut").value,guests:document.getElementById("sGuests").value})})'
                class="w-full bg-gold-500 hover:bg-gold-600 text-navy-900 font-semibold py-2 rounded-lg text-sm transition cursor-pointer">Book Now</button>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  } catch(e) { out.innerHTML = `<div class="bg-red-50 text-red-600 rounded-2xl p-6 text-center">${esc(e.message||'Search failed')}</div>`; }
  finally { btn.disabled = false; }
}

function openBookingModal(d) {
  const m = document.createElement('div');
  m.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4';
  m.onclick = e => { if (e.target === m) m.remove(); };
  const nights = Math.ceil((new Date(d.checkOut) - new Date(d.checkIn)) / 86400000);
  m.innerHTML = `
  <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 fade-in">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-display text-lg font-bold text-navy-700">Confirm Booking</h3>

async function doBook(d) {
  const btn = document.getElementById('bookConfirmBtn');
  btn.disabled = true; btn.textContent = 'Reserving...';
  try {
    const r = await api('POST', '/api/bookings', { hotelId: d.hotelId, roomTypeId: d.roomTypeId, checkIn: d.checkIn, checkOut: d.checkOut, guests: parseInt(d.guests) });
    document.querySelector('.fixed')?.remove();
    toast('Booking reserved! ID: ' + r.data.booking._id.slice(-6), 'success');
    showSection('mybookings');
  } catch(e) { toast(e.message || 'Booking failed', 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Reserve Now'; }
}

async function lookupBooking() {
  const id = document.getElementById('bId').value.trim();
  if (!id) return toast('Enter a booking ID', 'error');
  const out = document.getElementById('bookingDetail');
  out.innerHTML = '<div class="text-center py-4 text-gray-400">Loading...</div>';
  try {
    const r = await api('GET', '/api/bookings/' + id);
    const b = r.data;
    const isStaff = state.user.role === 'admin' || state.user.role === 'staff';
    let actions = '';
    if (isStaff) {
      if (b.status === 'RESERVED') actions = `<button onclick="bookingAction('${b._id}','confirm')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">Confirm</button>`;
      if (b.status === 'CONFIRMED') actions = `<button onclick="bookingAction('${b._id}','checkin')" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">Check In</button>`;
      if (b.status === 'CHECKED_IN') actions = `<button onclick="bookingAction('${b._id}','checkout')" class="bg-navy-700 hover:bg-navy-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">Check Out</button>`;
    }
    if ((isStaff || (b.guestId && b.guestId._id === state.user._id)) && (b.status === 'RESERVED' || b.status === 'CONFIRMED')) {
      actions += ` <button onclick="bookingAction('${b._id}','cancel')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">Cancel</button>`;
    }
    if (isStaff || (b.guestId && b.guestId._id === state.user._id)) {
      actions += ` <button onclick="bookingAction('${b._id}','invoice')" class="border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">Invoice</button>`;
    }
    out.innerHTML = `
    <div class="border border-gray-200 rounded-xl p-5 fade-in">
      <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
        <div>
          <div class="text-xs text-gray-400 mb-1">Booking ID: ${b._id}</div>
          <div class="flex items-center gap-2">${statusBadge(b.status)}</div>
        </div>
        <div class="flex gap-2 flex-wrap">${actions}</div>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">

        <div><span class="text-gray-400 text-xs">Hotel</span><div class="font-medium">${b.hotelId ? esc(b.hotelId.name) : '-'}</div></div>
        <div><span class="text-gray-400 text-xs">Room Type</span><div class="font-medium">${b.roomTypeId ? esc(b.roomTypeId.name) : '-'}</div></div>
        <div><span class="text-gray-400 text-xs">Room #</span><div class="font-medium">${b.roomId ? esc(b.roomId.roomNumber) : '-'}</div></div>
        <div><span class="text-gray-400 text-xs">Check-in</span><div class="font-medium">${formatDate(b.checkIn)}</div></div>
        <div><span class="text-gray-400 text-xs">Check-out</span><div class="font-medium">${formatDate(b.checkOut)}</div></div>
        <div><span class="text-gray-400 text-xs">Guests</span><div class="font-medium">${b.guests}</div></div>
        <div><span class="text-gray-400 text-xs">Nights</span><div class="font-medium">${b.nights}</div></div>
        <div><span class="text-gray-400 text-xs">Total</span><div class="font-bold text-gold-600">${formatCurrency(b.totalAmount)}</div></div>

function editHotel(id, name, city, amenities, rating) {
  showHotelForm({ _id:id, name, city, amenities: amenities.split(', '), rating: parseInt(rating)||0 });
}

async function saveHotel(id) {
  const data = {
    name: document.getElementById('hName').value.trim(),
    city: document.getElementById('hCity').value.trim(),
    amenities: document.getElementById('hAmenities').value.split(',').map(s=>s.trim()).filter(Boolean),
    rating: parseInt(document.getElementById('hRating').value) || 0
  };
  if (!data.name || !data.city) return toast('Name and city required', 'error');
  try {
    if (id) await api('PUT', '/api/hotels/'+id, data);
    else await api('POST', '/api/hotels', data);
    toast(id ? 'Hotel updated' : 'Hotel created', 'success');
    renderHotels(document.getElementById('content'));
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteItem(url, label) {
  if (!confirm('Delete this ' + label + '?')) return;
  try { await api('DELETE', url); toast(label + ' deleted', 'success'); showSection(state.section); }
  catch(e) { toast(e.message, 'error'); }
}

      <div class="flex gap-2 mt-4">
        <button onclick="saveRoom(${isEdit ? "'"+room._id+"'" : 'null'})" class="bg-navy-700 hover:bg-navy-800 text-white px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer">${isEdit?'Update':'Create'}</button>
        <button onclick="document.getElementById('roomFormArea').innerHTML=''" class="border border-gray-300 hover:bg-gray-50 text-gray-600 px-4 py-2 rounded-lg text-sm transition cursor-pointer">Cancel</button>
      </div>
    </div>`;
  });
}

function editRoom(id, number, typeId, status) { showRoomForm({ _id:id, roomNumber:number, roomTypeId:typeId, housekeepingStatus:status }); }

async function saveRoom(id) {
  const data = {
    roomNumber: document.getElementById('rNumber').value.trim(),
    roomTypeId: document.getElementById('rType').value,
    housekeepingStatus: document.getElementById('rStatus').value
  };
  if (!data.roomNumber || !data.roomTypeId) return toast('All fields required', 'error');
  try {
    if (id) await api('PUT', '/api/rooms/'+id, data);
    else await api('POST', '/api/rooms', data);
    toast(id ? 'Room updated' : 'Room created', 'success');
    renderRooms(document.getElementById('content'));
  } catch(e) { toast(e.message, 'error'); }
}

async function updateHousekeeping(id, current) {
  const next = prompt(`Current status: ${current}\nNew status (CLEAN / DIRTY / MAINTENANCE):`, current);
  if (!next || next === current) return;
  if (!['CLEAN','DIRTY','MAINTENANCE'].includes(next.toUpperCase())) return toast('Invalid status', 'error');
  try {
    await api('PUT', `/api/rooms/${id}/housekeeping`, { housekeepingStatus: next.toUpperCase() });
    toast('Status updated', 'success');
    renderRooms(document.getElementById('content'));
  } catch(e) { toast(e.message, 'error'); }
}

// ── Pricing (Admin) ──
async function renderPricing(c) {
  c.innerHTML = '<div class="text-center py-8 text-gray-400">Loading pricing rules...</div>';
  try {
    const [rulesR, typesR] = await Promise.all([api('GET', '/api/pricing-rules'), api('GET', '/api/room-types')]);
    const rules = rulesR.data;
    const types = typesR.data;
    c.innerHTML = `
    <div class="flex flex-wrap items-center justify-between mb-6 gap-3">
      <div><h2 class="font-display text-2xl font-bold text-navy-700 mb-1">Pricing Rules</h2><p class="text-gray-500 text-sm">Dynamic seasonal and weekend pricing multipliers</p></div>
      <button onclick="showPricingForm()" class="bg-gold-500 hover:bg-gold-600 text-navy-900 font-semibold px-4 py-2 rounded-lg text-sm transition cursor-pointer">Add Rule</button>
    </div>
    <div id="pricingFormArea"></div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${rules.map(r => `
        <div class="bg-white rounded-2xl shadow-lg p-5 hover:shadow-xl transition">
          <div class="flex justify-between items-start mb-2">
            <span class="font-semibold text-navy-700">${esc(r.season)}</span>
            <div class="flex gap-1">
              <button onclick="editPricing('${r._id}','${esc(r.season)}','${r.roomTypeId?r.roomTypeId._id:''}','${r.startDate?r.startDate.split('T')[0]:''}','${r.endDate?r.endDate.split('T')[0]:''}','${r.multiplier}')" class="text-gray-400 hover:text-navy-600 cursor-pointer p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
              <button onclick="deleteItem('/api/pricing-rules/${r._id}','rule')" class="text-gray-400 hover:text-red-600 cursor-pointer p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
            </div>
          </div>
          <div class="text-sm space-y-1">
            <div class="text-gray-500">${r.roomTypeId ? esc(r.roomTypeId.name) : '-'}</div>
            <div class="text-gray-400 text-xs">${formatDate(r.startDate)} - ${formatDate(r.endDate)}</div>
            <div class="text-gold-600 font-bold text-lg">${r.multiplier}x multiplier</div>
          </div>
        </div>
      `).join('')}
    </div>`;
    window._pricingTypes = types;
  } catch(e) { c.innerHTML = `<div class="text-red-500">${esc(e.message)}</div>`; }
}

function showPricingForm(rule) {
  const isEdit = !!rule;
  const types = (window._pricingTypes||[]).map(t => `<option value="${t._id}" ${isEdit&&rule.roomTypeId===t._id?'selected':''}>${esc(t.name)}</option>`).join('');
  document.getElementById('pricingFormArea').innerHTML = `
  <div class="bg-white border border-gold-300 rounded-xl p-5 mb-6 fade-in">
    <h3 class="font-semibold text-navy-700 mb-3">${isEdit ? 'Edit' : 'New'} Pricing Rule</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div><label class="block text-sm text-gray-600 mb-1">Room Type</label><select id="prType" class="w-full border rounded-lg px-3 py-2 text-sm bg-white">${types}</select></div>
      <div><label class="block text-sm text-gray-600 mb-1">Season Name</label><input id="prSeason" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="e.g. Peak Season" value="${isEdit?esc(rule.season):''}"></div>
      <div><label class="block text-sm text-gray-600 mb-1">Multiplier</label><input id="prMult" type="number" step="0.1" min="0.1" class="w-full border rounded-lg px-3 py-2 text-sm" value="${isEdit?rule.multiplier:'1.0'}"></div>
      <div><label class="block text-sm text-gray-600 mb-1">Start Date</label><input id="prStart" type="date" class="w-full border rounded-lg px-3 py-2 text-sm" value="${isEdit?rule.startDate:''}"></div>
      <div><label class="block text-sm text-gray-600 mb-1">End Date</label><input id="prEnd" type="date" class="w-full border rounded-lg px-3 py-2 text-sm" value="${isEdit?rule.endDate:''}"></div>
    </div>
    <div class="flex gap-2 mt-4">
      <button onclick="savePricing(${isEdit ? "'"+rule._id+"'" : 'null'})" class="bg-navy-700 hover:bg-navy-800 text-white px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer">${isEdit?'Update':'Create'}</button>
      <button onclick="document.getElementById('pricingFormArea').innerHTML=''" class="border border-gray-300 hover:bg-gray-50 text-gray-600 px-4 py-2 rounded-lg text-sm transition cursor-pointer">Cancel</button>
    </div>
  </div>`;
}

function editPricing(id, season, typeId, start, end, mult) {
  showPricingForm({ _id:id, season, roomTypeId:typeId, startDate:start, endDate:end, multiplier:mult });
}

async function savePricing(id) {
  const data = {
    roomTypeId: document.getElementById('prType').value,
    season: document.getElementById('prSeason').value.trim(),
    multiplier: parseFloat(document.getElementById('prMult').value),
    startDate: document.getElementById('prStart').value,
    endDate: document.getElementById('prEnd').value
  };
  if (!data.season || !data.multiplier) return toast('Fill in all fields', 'error');
  try {
    if (id) await api('PUT', '/api/pricing-rules/'+id, data);
    else await api('POST', '/api/pricing-rules', data);
    toast(id ? 'Rule updated' : 'Rule created', 'success');
    renderPricing(document.getElementById('content'));
  } catch(e) { toast(e.message, 'error'); }
}

// ── Reports (Admin) ──
async function renderReports(c) {
  c.innerHTML = '<div class="text-center py-8 text-gray-400">Generating report...</div>';
  try {
    const r = await api('GET', '/api/admin/reports/occupancy');
    const d = r.data;
    const s = d.systemSummary;
    c.innerHTML = `
    <div class="mb-6">
      <h2 class="font-display text-2xl font-bold text-navy-700 mb-1">Occupancy & Revenue Report</h2>
      <p class="text-gray-500 text-sm">System-wide performance overview</p>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-gray-400 mb-1">Hotels</div><div class="text-2xl font-bold text-navy-700">${s.totalHotels}</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-gray-400 mb-1">Total Rooms</div><div class="text-2xl font-bold text-navy-700">${s.totalRooms}</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-gray-400 mb-1">Occupancy Rate</div><div class="text-2xl font-bold text-gold-600">${s.overallOccupancyRate}</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-gray-400 mb-1">Total Bookings</div><div class="text-2xl font-bold text-navy-700">${s.totalBookings}</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-gray-400 mb-1">Gross Revenue</div><div class="text-2xl font-bold text-green-600">${formatCurrency(s.totalGrossRevenue)}</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-gray-400 mb-1">Refunds</div><div class="text-2xl font-bold text-red-500">${formatCurrency(s.totalRefunds)}</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-gray-400 mb-1">Net Revenue</div><div class="text-2xl font-bold text-navy-700">${formatCurrency(s.totalNetRevenue)}</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-gray-400 mb-1">Occupied Rooms</div><div class="text-2xl font-bold text-purple-600">${s.totalOccupiedRooms}</div></div>
    </div>
    <h3 class="font-semibold text-navy-700 mb-3">Properties</h3>
    ${d.properties.length === 0 ? '<p class="text-gray-400 text-sm">No properties found.</p>' : d.properties.map(p => `
      <div class="bg-white rounded-xl shadow-lg p-5 mb-4">
        <div class="flex items-center justify-between mb-3">
          <div><h4 class="font-display font-bold text-navy-700">${esc(p.name)}</h4><p class="text-gray-500 text-xs">${esc(p.city)} &middot; ${stars(p.rating)}</p></div>
          <span class="text-gold-600 font-bold">${p.inventory.occupancyRate} occupied</span>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
          <div><span class="text-gray-400 text-xs">Rooms</span><div class="font-medium">${p.inventory.totalRooms} total / ${p.inventory.occupiedRooms} occupied</div></div>
          <div><span class="text-gray-400 text-xs">Clean / Dirty / Maint.</span><div class="font-medium">${p.inventory.cleanRooms} / ${p.inventory.dirtyRooms} / ${p.inventory.maintenanceRooms}</div></div>
          <div><span class="text-gray-400 text-xs">Bookings</span><div class="font-medium">${p.bookingVolume.totalBookings} (R:${p.bookingVolume.reserved} C:${p.bookingVolume.confirmed} I:${p.bookingVolume.checkedIn} O:${p.bookingVolume.checkedOut} X:${p.bookingVolume.cancelled})</div></div>
          <div><span class="text-gray-400 text-xs">Revenue</span><div class="font-medium">${formatCurrency(p.financials.grossRevenue)} gross / ${formatCurrency(p.financials.netRevenue)} net</div></div>
        </div>
      </div>
    `).join('')}`;
  } catch(e) { c.innerHTML = `<div class="text-red-500">${esc(e.message)}</div>`; }
}

// ── Health check ──
async function checkHealth() {
  try {
    const r = await api('GET', '/api/health');
    const el = document.getElementById('heroHealth');
    if (el) el.innerHTML = `<div class="bg-green-500/20 border border-green-400/50 text-green-200 rounded-lg px-4 py-2 text-sm inline-block">${r.message} &middot; ${r.data.timestamp}</div>`;
    toast('API is healthy', 'success');
  } catch(e) { toast('API unreachable', 'error'); }
}

// ── Init ──
loadSession();
if (!state.user) { document.getElementById('hero').classList.remove('hidden'); }
</script>
</body>
