<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Hotel API Demo</title></head>
<body>
<h1>Hotel Booking — Minimal Demo</h1>
<p>Server: <b>http://localhost:5000</b>. Use this to show APIs live.</p>

<h2>1. Health</h2>
<button onclick="fetchJson('/api/health').then(j=>document.getElementById('health').innerText=JSON.stringify(j))">Check Health</button>
<pre id="health"></pre>

<h2>2. Register Guest</h2>
<input id="regName" placeholder="Name" value="Guest1"><input id="regEmail" placeholder="Email" value="guest1@mail.com"><input id="regPass" placeholder="Password" type="password" value="123456"><button onclick="fetchPost('/api/auth/register',{name:document.getElementById('regName').value,email:document.getElementById('regEmail').value,password:document.getElementById('regPass').value,role:'guest'})">Register</button>
<pre id="reg"></pre>

<h2>3. Search Availability</h2>
<input id="q" placeholder="?checkIn=2026-09-01&checkOut=2026-09-05"><button onclick="fetchJson('/api/hotels/search'+document.getElementById('q').value).then(j=>document.getElementById('search').innerText=JSON.stringify(j,null,2))">Search</button>
<pre id="search"></pre>

<h2>4. Create Booking (after login)</h2>
<textarea id="book" rows="3" cols="60">{"hotelId":"","roomTypeId":"","checkIn":"2026-09-01","checkOut":"2026-09-03","guests":2}</textarea><br><button onclick="fetchPost('/api/bookings',JSON.parse(document.getElementById('book').value))">Book (needs Bearer token header — add in code or use Postman)</button>
<pre id="bookRes"></pre>

<script>
async function fetchJson(url){const r=await fetch('http://localhost:5000'+url);return r.json();}
async function fetchPost(url,body){const r=await fetch('http://localhost:5000'+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json();}
</script>
</body></html>
